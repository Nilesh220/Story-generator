      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {

    }

      width: 100%;
      height: 380px;
      background: #000;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .card:hover .img-container img {
      transform: scale(1.03);
    }
    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(245, 158, 11, 0.9);
      color: #000;
      font-weight: 700;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;

      font-weight: 700;

      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);

      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

      font-weight: 700;
      color: #fff;
    }
    .poc-tag {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 600;
    }
    .meta-row {

      display: flex;
      justify-content: space-between;
    }
    .meta-row span {

      white-space: nowrap;

    .card-actions {

    .btn {

    // Populate POC filter
    const pocSet = new Set(data.map(d => d.poc_name || d.poc_id).filter(Boolean));
    const pocSelect = document.getElementById('pocFilter');
    Array.from(pocSet).sort().forEach(poc => {
      const opt = document.createElement('option');
      opt.value = poc;
      opt.textContent = poc;
      pocSelect.appendChild(opt);
    });

    function render(items) {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = items.map(item => `
        <div class="card" data-poc="${item.poc_name || item.poc_id}" data-text="${(item.full_name + ' ' + item.poc_name + ' ' + item.mobile + ' ' + item.email + ' ' + item.preferred_store + ' ' + item.college_city).toLowerCase()}">
          <div class="img-container" onclick="window.open('${item.local_file}', '_blank')">
            <span class="index-badge">#${item.index}</span>
            <span class="badge">Views Pending</span>
            <img src="${item.local_file}" alt="${item.full_name}" loading="lazy" onerror="this.src='${item.story_url}'">
          </div>
          <div class="card-body">
            <div class="student-name">${item.full_name || 'Anonymous'}</div>
            <div class="poc-tag">POC: ${item.poc_name || item.poc_id || 'N/A'}</div>
            <div class="meta-row">
              <span>📞 ${item.mobile || 'N/A'}</span>
              <span>📍 ${item.college_city || item.preferred_store || '-'}</span>
            </div>
            <div class="meta-row">
              <span>🏬 ${item.preferred_store || '-'}</span>
            </div>
            <div class="card-actions">
              <a href="${item.local_file}" target="_blank" class="btn">View Image</a>
              <a href="${item.story_url}" target="_blank" class="btn btn-primary">Cloudinary</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCards() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const poc = document.getElementById('pocFilter').value;
      const filtered = data.filter(d => {
        const text = (d.full_name + ' ' + d.poc_name + ' ' + d.poc_id + ' ' + d.mobile + ' ' + d.email + ' ' + d.preferred_store + ' ' + d.college_city).toLowerCase();
        const matchesSearch = !search || text.includes(search);
        const matchesPoc = !poc || (d.poc_name === poc || d.poc_id === poc);
        return matchesSearch && matchesPoc;
      });
      render(filtered);
    }

    render(data);
  </script>
